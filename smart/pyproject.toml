[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-transfer"
version = "0.1.0"
description = "SMART: A Spectral Transfer Approach to Multi-Task Learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Boxin Zhao" },
    { name = "Mladen Kolar" },
    { name = "Jinchi Lv" },
]
keywords = [
    "transfer learning",
    "multi-task learning",
    "reduced-rank regression",
    "spectral methods",
    "ADMM",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
    "joblib>=1.2",
    "optuna>=3.0",
    "autograd>=1.5",
    "pymanopt>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/boxinz17/smart"
Repository = "https://github.com/boxinz17/smart"
Issues = "https://github.com/boxinz17/smart/issues"
Paper = "https://arxiv.org/abs/2604.20161"

[tool.setuptools.packages.find]
where = ["."]
include = ["smart*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
