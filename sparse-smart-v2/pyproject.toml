[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-smart-v2"
version = "0.1.0"
description = "Hard-sparse two-stage SMART with expanded unpenalized source directions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["sparse-smart==0.5.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparse_smart_v2 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
