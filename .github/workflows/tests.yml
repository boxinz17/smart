name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project packages and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./smart[test]
          pip install -e ./bi-smart[test]

      - name: Run pytest
        # The two package suites both use a top-level ``tests`` package, so
        # collect them in separate Python processes to avoid import collisions.
        run: |
          python -m pytest -q smart/tests
          python -m pytest -q bi-smart/tests
          python -m pytest -q simulation/tests
