name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up standardized Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: python-constraints.txt

      - name: Install pinned build and test tools
        run: python -m pip install --constraint python-constraints.txt setuptools wheel pytest

      - name: Install project packages and test dependencies
        run: |
          python -m pip install --constraint python-constraints.txt --no-build-isolation -e './smart[test]' -e './bi-smart[test]' -e './sparse-smart[test]'

      - name: Verify standardized runtime
        run: |
          python -m pip check
          python environment/check_runtime.py

      - name: Run pytest
        # The two package suites both use a top-level ``tests`` package, so
        # collect them in separate Python processes to avoid import collisions.
        run: |
          python -m pytest -q smart/tests
          python -m pytest -q bi-smart/tests
          python -m pytest -q simulation/tests
