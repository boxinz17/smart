name: sparse-smart

on:
  push:
    paths: ["sparse-smart/**", "simulation/run_sparse_smart*.py", "simulation/tests/test_run_sparse_smart*.py", ".github/workflows/sparse-smart.yml"]
  pull_request:
    paths: ["sparse-smart/**", "simulation/run_sparse_smart*.py", "simulation/tests/test_run_sparse_smart*.py", ".github/workflows/sparse-smart.yml"]

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: python -m pip wheel --no-deps ./sparse-smart --wheel-dir wheelhouse
      - name: Install wheel and test runner
        run: python -m pip install wheelhouse/*.whl pytest
      - name: Test installed package
        run: python -m pytest -q sparse-smart/tests --import-mode=importlib
      - name: Run examples
        run: python sparse-smart/examples/exact_and_noisy.py
      - name: Test simulation runners
        run: python -m pytest -q simulation/tests/test_run_sparse_smart.py simulation/tests/test_run_sparse_smart_tuned.py --import-mode=importlib
