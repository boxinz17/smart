[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-smart"
version = "0.3.0"
description = "Sparse two-stage spectral transfer regression with anchor coordinates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Boxin Zhao"},
  {name = "Mladen Kolar"},
  {name = "Jinchi Lv"},
]
dependencies = ["numpy>=1.23", "scipy>=1.9", "scikit-learn>=1.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparse_smart = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
