[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-smart"
version = "0.5.0"
description = "Sparse two-stage spectral transfer regression with anchor coordinates"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Boxin Zhao"},
  {name = "Mladen Kolar"},
  {name = "Jinchi Lv"},
]
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "scikit-learn==1.9.0",
  "joblib==1.6.0",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparse_smart = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
